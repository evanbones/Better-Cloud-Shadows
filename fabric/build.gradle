plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

def mappingsAttribute = Attribute.of('net.minecraft.mappings', String)

dependencies {
    attributesSchema {
        attribute(mappingsAttribute)
    }

    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    // Better Clouds
    modCompileOnly "maven.modrinth:better-clouds:${better_clouds_fabric_id}"
    //modRuntimeOnly "maven.modrinth:better-clouds:${better_clouds_fabric_id}"

    // Cloud Layers
    modCompileOnly "maven.modrinth:cloud-layers:${cloud_layers_fabric_id}"
    //modRuntimeOnly "maven.modrinth:cloud-layers:${cloud_layers_fabric_id}"

    // Cirrus
    modCompileOnly "maven.modrinth:cirrus:${cirrus_fabric_id}"
    //modRuntimeOnly "maven.modrinth:cirrus:${cirrus_fabric_id}"

    // Cloud Tweaks
    modCompileOnly "maven.modrinth:cloud_tweaks:${cloud_tweaks_fabric_id}"
    //modRuntimeOnly "maven.modrinth:cloud_tweaks:${cloud_tweaks_fabric_id}"

    // Distant Horizons
    compileOnly "maven.modrinth:distanthorizons:${distant_horizons_id}"
    //modRuntimeOnly "maven.modrinth:distanthorizons:${distant_horizons_id}"

    // LambDynamicLights
    modCompileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${lambdynamiclights_version}") {
        transitive = false
        attributes {
            attribute(mappingsAttribute, 'intermediary')
        }
    }
    modCompileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${lambdynamiclights_version}") {
        transitive = false
        attributes {
            attribute(mappingsAttribute, 'intermediary')
        }
    }
    modCompileOnly("dev.lambdaurora:spruceui:${spruceui_version}") {
        transitive = false
        attributes {
            attribute(mappingsAttribute, 'intermediary')
        }
    }
    modCompileOnly("dev.yumi.mc.core:yumi-mc-foundation:${yumi_mc_version}") {
        transitive = false
        attributes {
            attribute(mappingsAttribute, 'intermediary')
        }
    }

    // YACL
    modCompileOnly "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"
    modRuntimeOnly "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"
    runtimeOnly "org.quiltmc.parsers:json:0.3.0"
    runtimeOnly "org.quiltmc.parsers:gson:0.3.0"

    // Mod Menu
    modCompileOnly "com.terraformersmc:modmenu:${mod_menu_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:${mod_menu_version}"

    include implementation("com.moulberry:mixinconstraints:${mixin_constraints_version}")

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
}