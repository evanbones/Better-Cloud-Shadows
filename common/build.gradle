plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

def mappingsAttribute = Attribute.of('net.minecraft.mappings', String)

dependencies {
    attributesSchema {
        attribute(mappingsAttribute)
    }

    compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}-neoforge"
    compileOnly "maven.modrinth:better-clouds:${better_clouds_neoforge_id}"
    compileOnly "maven.modrinth:cloud-layers:${cloud_layers_neoforge_id}"
    compileOnly "maven.modrinth:cirrus:${cirrus_neoforge_id}"
    compileOnly "maven.modrinth:cloud_tweaks:${cloud_tweaks_neoforge_id}"
    compileOnly "maven.modrinth:distanthorizons:${distant_horizons_id}"

    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${lambdynamiclights_version}") {
        attributes {
            attribute(mappingsAttribute, 'mojmap')
        }
    }
    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${lambdynamiclights_version}") {
        transitive = false
        attributes {
            attribute(mappingsAttribute, 'mojmap')
        }
    }
    // Supertypes of LambDynamicLights classes, needed on the compile classpath
    compileOnly("dev.lambdaurora:spruceui:${spruceui_version}") {
        transitive = false
        attributes {
            attribute(mappingsAttribute, 'mojmap')
        }
    }
    compileOnly("dev.yumi.mc.core:yumi-mc-foundation:${yumi_mc_version}") {
        transitive = false
        attributes {
            attribute(mappingsAttribute, 'mojmap')
        }
    }

    compileOnly "com.moulberry:mixinconstraints:${mixin_constraints_version}"
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.6'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
